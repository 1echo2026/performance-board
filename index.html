<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>业绩看板系统</title>
<link rel="stylesheet" href="./css/app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e3a8a'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-size='32' fill='white' font-family='sans-serif' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E" />
</head>
<body>
<!-- 顶部导航 -->
<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-mark">B</span>
      <span class="brand-text">业绩看板</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-right" id="topbar-right"></div>
  </div>
</header>

<!-- 主内容 -->
<main id="app"></main>

<!-- Toast / Modal -->
<div id="toast-host"></div>
<div id="modal-host"></div>

<script>
  // 运行时探针：确认 inline JS 可执行
  window.__PB_INLINE_LOADED = true;
  console.log('[PB] inline script loaded, href=', location.href);
</script>
<script type="module" src="./js/app.js"></script>
<script>
  // 错误捕获
  window.addEventListener('error', e => {
    console.error('[PB ERROR]', e.error || e.message);
    document.body.dataset.pbError = e.message;
  });
  window.addEventListener('unhandledrejection', e => {
    console.error('[PB REJECT]', e.reason);
    document.body.dataset.pbReject = String(e.reason?.message || e.reason);
  });
</script>
</body>
</html>
